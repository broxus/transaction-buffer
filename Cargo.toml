[package]
name = "transaction-buffer"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
compact-logs = []

[dependencies]
itertools = "0.11.0"
tokio = { version = "1", features = ["full"] }
transaction-consumer = { git = "https://github.com/broxus/transaction-consumer", default-features = false }
# transaction-consumer = { path = "../transaction-consumer-ssh", default-features = false }
anyhow = "1.0.38"
chrono = { version = "*" }
ton_types = { git = "https://github.com/broxus/ton-labs-types" }
ton_block = { git = "https://github.com/broxus/ton-labs-block.git" }
futures = { version = "0.3" }
sqlx = { version = "0.6.2", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "offline",
    "chrono",
    "json",
] }
nekoton-abi = { git = "https://github.com/broxus/nekoton.git" }
ton_abi = { git = "https://github.com/broxus/ton-labs-abi.git" }
weedb = "0.1.1"
fdlimit = "0.2.1"
rlimit = "0.9.1"
base64 = "0.13.0"
reqwest = { version = "0.11.20", features = ["json"] }
tracing = { version = "0.1.34", default-features = false, features = [
    "std",
    "attributes",
] }
rdkafka = { version = "0.36.2", default-features = false, features = [
    "ssl-vendored",
] }

[dev-dependencies]
env-file-reader = "0.3.0"
